<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Алекс</title>
<meta property="og:title" content="Алекс">
<meta property="og:description" content="Тук съм всеки ден 💋">
<meta property="og:image" content="alex2.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--fon:#1A1214;--karta:#251A1D;--tekst:#F7EDEE;--sivo:#C9B6B9;--roza:#E8798F;--roza-d:#D65F77;--lin:#3A2A2E}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--fon);color:var(--tekst);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center;padding:28px 18px 40px}
main{width:min(420px,100%);text-align:center}
.snimka{width:100%;aspect-ratio:3/4;border-radius:22px;object-fit:cover;object-position:50% 22%;border:2px solid var(--roza);box-shadow:0 18px 50px rgba(232,121,143,.22);margin:0 auto 20px;display:block}
h1{font-family:"Playfair Display",serif;font-style:italic;font-weight:600;font-size:40px;margin:0;line-height:1.1}
.pod{color:var(--sivo);margin:8px 0 28px;font-size:16px}
a.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px 20px;margin:0 0 14px;border-radius:16px;text-decoration:none;font-weight:700;font-size:17px;transition:transform .15s,background .2s}
a.btn:active{transform:scale(.98)}
.glaven{background:var(--roza);color:#fff;box-shadow:0 10px 30px rgba(232,121,143,.28)}
.glaven:hover{background:var(--roza-d)}
.vtori{background:var(--karta);color:var(--tekst);border:1px solid var(--lin)}
.vtori:hover{border-color:var(--roza)}
.btn svg{width:22px;height:22px;flex:none}
.btn small{display:block;font-weight:500;font-size:13px;opacity:.85}
.btn span{text-align:left}
footer{color:#7E6B6E;font-size:12px;margin-top:26px}
@media(prefers-reduced-motion:reduce){a.btn{transition:none}}
</style>
</head>
<body>
<main>
  <img class="snimka" src="alex2.jpg" alt="Алекс">
  <h1>Алекс</h1>
  <p class="pod">Тук съм всеки ден 💋</p>
  <a class="btn glaven" href="https://www.fanvue.com/alexeqka" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-9.3-9A5.3 5.3 0 0 1 12 6a5.3 5.3 0 0 1 9.3 6C19 16.6 12 21 12 21z"/></svg>
    <span>Моята страница<small>Снимките, които не са за Instagram</small></span>
  </a>
  <a class="btn vtori" href="https://t.me/+k8LM3PKGwHQ3OWY8" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4 3 11l6 2 2 6 3-4 5 4z"/><path d="m9 13 12-9"/></svg>
    <span>Telegram канал<small>Пиша там всеки ден</small></span>
  </a>
</main>
</body>
</html>
